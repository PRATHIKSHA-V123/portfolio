<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contact PRATHIKSHA V for web development projects, questions and opportunities."
    >

    <title>Contact | PRATHIKSHA V</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Skip link -->
    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>

    <!-- Header -->
    <header class="site-header">

        <div class="container">

            <h1>Contact Me</h1>

            <p>
                I'd love to hear from you
            </p>

        </div>

    </header>

    <!-- Navigation -->
    <nav
        class="site-navigation"
        aria-label="Main navigation"
    >

        <div class="container">

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a
                        href="contact.html"
                        aria-current="page"
                    >
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Main Content -->
    <main id="main-content">

        <section
            class="content-section"
            aria-labelledby="contact-heading"
        >

            <div class="container">

                <h2 id="contact-heading">
                    Get In Touch
                </h2>

                <p>
                    Fill out the form below to send me a message.
                </p>

                <!-- Accessible Contact Form -->
                <form
                    class="contact-form"
                    action="#"
                    method="post"
                >

                    <!-- Name -->
                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <!-- Subject -->
                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                        >

                    </div>

                    <!-- Message -->
                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="7"
                            required
                        ></textarea>

                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="button"
                    >
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 PRATHIKSHA V.
                All rights reserved.
            </p>

        </div>

    </footer>

</body>

</html>
